<style>:root{
  --bg:#F5F1EA; --panel:#FFFFFF; --ink:#1F2A33; --muted:#5F6B73; --faint:#8A959D; --line:#E4E0D8;

}
:root[data-theme="dark"]{

  --brand:#5FB3AB; --brand2:#6CC3BA; --brandsoft:#1F3533; --dark:#0E1418;

  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}

.brand small{display:block;font-weight:600;font-size:11px;letter-spacing:1.6px;color:#8FC5BF;margin-top:2px;text-transform:uppercase}
.who{padding:0 10px 16px;font-size:12px;color:#9FB0B5}
.nav{display:flex;flex-direction:column;gap:2px}

.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:#2E5F5B;color:#fff}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.side .foot{margin-top:auto;font-size:11.5px;color:#8C9CA2;padding:10px;line-height:1.5}
.side .foot b{color:#CFE3E0}
.main{padding:26px 30px 90px;max-width:1180px;width:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:26px;margin:0;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:13.5px;margin-top:2px}
h2{font-size:16px;margin:0 0 10px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g-hero{grid-template-columns:1.25fr 1fr}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 18px;border:1px solid var(--line)}
.card.flush{padding:0;overflow:hidden}
.kpi .lab{font-size:11.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint)}
.kpi .val{font-size:26px;font-weight:800;margin-top:4px;letter-spacing:-.4px}
.kpi .note{font-size:12.5px;color:var(--muted);margin-top:2px}
.hero{background:var(--dark);color:#fff;border:none;position:relative;overflow:hidden}
:root[data-theme="dark"] .hero{background:#0F3B38}
.hero .lab{color:#8FC5BF}
.hero .big{font-size:52px;font-weight:800;letter-spacing:-1px;line-height:1.05;margin:6px 0 4px}
.hero .note{color:#C5D3D1}
.hero .pd{display:inline-block;margin-top:10px;background:rgba(255,255,255,.1);padding:6px 10px;border-radius:999px;font-size:13px;font-weight:600}
.hero.neg .big{color:#FFB4A9}
.how{all:unset;cursor:pointer;color:#8FC5BF;font-size:12.5px;font-weight:600;text-decoration:underline;margin-top:10px;display:inline-block}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:10px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--brand2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand2)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);text-align:left;font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.p-good{background:var(--goodsoft);color:var(--good)}.p-warn{background:var(--warnsoft);color:var(--warn)}.p-bad{background:var(--badsoft);color:var(--bad)}.p-mute{background:var(--brandsoft);color:var(--brand)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand2);border-radius:99px}
.bar i.over{background:var(--bad)}.bar i.near{background:var(--warn)}
.muted{color:var(--muted)}.faint{color:var(--faint)}.pos{color:var(--good)}.neg{color:var(--bad)}
.small{font-size:12.5px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li .t{font-weight:650}
.li .s{font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:650;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand2);outline-offset:0;border-color:transparent}
.form{display:grid;gap:12px}
.form.c2{grid-template-columns:1fr 1fr}.form.c3{grid-template-columns:1fr 1fr 1fr}
.full{grid-column:1/-1}
.seg{display:inline-flex;background:var(--brandsoft);border-radius:10px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;font-weight:650;font-size:13px;color:var(--brand)}
.seg button.on{background:var(--panel);box-shadow:var(--shadow);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);padding:6px 11px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
input.inl{width:110px;text-align:right;padding:6px 8px}
.month{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.month button{width:32px;height:32px;padding:0;justify-content:center}
.overlay{position:fixed;inset:0;background:rgba(15,22,27,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--panel);border-radius:16px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0 0 4px;font-size:19px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:60;box-shadow:var(--shadow)}
.fab{position:fixed;right:24px;bottom:24px;z-index:40;border-radius:999px;padding:14px 20px;box-shadow:0 8px 24px rgba(46,95,91,.35);font-size:15px}
.banner{background:var(--warnsoft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.info{background:var(--brandsoft);color:var(--brand)}
.next{display:flex;gap:14px;align-items:center}
.next .ic{width:40px;height:40px;border-radius:12px;background:var(--brandsoft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.goal .ring{width:64px;height:64px;flex:none}
.tag{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--faint)}
.split{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.split:last-child{border-bottom:none}
.split b{font-variant-numeric:tabular-nums}
.mtabs{display:none}
.mshow{display:none}
.tabbar{display:none}
.mshowb{display:none}
.morelist{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.morelist button{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 12px;border-radius:12px;font-weight:650;font-size:16px}
.morelist button.on{background:var(--brandsoft);color:var(--brand)}
.morelist svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (pointer:coarse){
  input[type=text],input[type=number],input[type=date],input[type=search],select,textarea,input.inl{font-size:16px}
  .btn{min-height:42px}
  .btn.sm{min-height:36px;padding:7px 12px}
  .chip{padding:9px 13px;font-size:14px}
  .seg button{padding:9px 14px}
  .btn:hover{border-color:var(--line)}
  .btn.pri:hover{background:var(--brand)}
}
/* tablets: icon rail */
@media (min-width:701px) and (max-width:1100px){
  .app{grid-template-columns:92px 1fr}
  .side{padding:calc(16px + env(safe-area-inset-top)) 8px 16px;align-items:stretch}
  .brand,.who,.side .foot{display:none}
  .nav button{flex-direction:column;gap:4px;padding:10px 4px;font-size:11.5px;text-align:center;justify-content:center}
  .nav svg{width:22px;height:22px}
  .main{padding:calc(22px + env(safe-area-inset-top)) 22px 100px;max-width:none}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-hero{grid-template-columns:1fr}
  .hero .big{font-size:46px}
}
/* phones: header + bottom tab bar */
@media (max-width:700px){
  .app{grid-template-columns:1fr;min-height:100dvh}
  .side{position:sticky;top:0;height:auto;z-index:30;flex-direction:row;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;gap:10px}
  .brand small,.who,.side .foot,.side .nav{display:none}
  .brand{padding:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .main{padding:16px 14px calc(96px + env(safe-area-inset-bottom))}
  .top{margin-bottom:14px}
  h1{font-size:23px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2,.g-hero{grid-template-columns:1fr}
  .grid{gap:12px}
  .card{padding:15px}
  .fab{display:none}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .kpi .val{font-size:21px}
  .form.c2,.form.c3{grid-template-columns:1fr}
  .hero .big{font-size:42px;word-break:break-word}
  .hide-m{display:none}
  .mshow{display:inline}
  .mshowb{display:block;margin-top:4px}
  td,th{padding:10px 10px}
  td.actc{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  input.inl{width:92px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(31,42,51,.08)}
  .tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:650;color:var(--faint);padding:4px 0;min-height:48px;-webkit-tap-highlight-color:transparent}
  .tabbar button.on{color:var(--brand)}
  .tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tabbar .tb-add{align-self:center;justify-self:center;width:54px;height:54px;min-height:0;border-radius:999px;background:var(--brand);color:#fff;box-shadow:0 6px 18px rgba(46,95,91,.35);margin-top:-18px}
  .tabbar .tb-add svg{width:26px;height:26px;stroke-width:2.6}
  .overlay{align-items:flex-end;padding:0}
  .modal{border-radius:18px 18px 0 0;max-height:92dvh;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
  .modal .acts .btn{flex:1;justify-content:center}
  .modal .acts .btn[data-del]{flex:0 0 auto}
  .month span{min-width:0!important;padding:0 4px}
  .top .row{width:100%}
}
@media print{.side,.fab,.btn,.tabbar{display:none!important}.app{display:block}}

function simulate(strategy,extra){
  var ds=S.debts.filter(function(d){return (+d.balance||0)>0;}).map(function(d){return {id:d.id,name:d.name,bal:+d.balance,apr:+d.apr||0,min:+d.min||0,paidOff:null};});
  if(!ds.length)return {months:0,interest:0,order:[],ok:true};
  var budget=ds.reduce(function(s,d){return s+d.min;},0)+(+extra||0);
  var month=0,interest=0,guard=0;
  function order(){var a=ds.filter(function(d){return d.bal>0.005;});a.sort(strategy==="snowball"?function(x,y){return x.bal-y.bal||y.apr-x.apr;}:function(x,y){return y.apr-x.apr||x.bal-y.bal;});return a;}
  while(ds.some(function(d){return d.bal>0.005;}) && guard<600){
    month++;guard++;
    ds.forEach(function(d){if(d.bal>0.005){var i=d.bal*d.apr/100/12;d.bal+=i;interest+=i;}});
    var left=budget;
    ds.forEach(function(d){if(d.bal>0.005){var p=Math.min(d.min,d.bal);d.bal-=p;left-=p;}});
    var o=order(),k=0;

  }
  var ok=guard<600;
  var ord=ds.slice().sort(function(a,b){return (a.paidOff||9999)-(b.paidOff||9999);});
  return {months:month,interest:round2(interest),order:ord,ok:ok,budget:budget};
}

function ring(p){var r=26,c=2*Math.PI*r,o=c*(1-Math.min(1,p));return '<svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="32" cy="32" r="'+r+'" fill="none" stroke="var(--brand2)" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+o.toFixed(1)+'" transform="rotate(-90 32 32)"/><text x="32" y="36" text-anchor="middle" style="font-size:13px;font-weight:800;fill:var(--ink)">'+Math.round(p*100)+'%</text></svg>';}

/* Debt */
function addMonthsLabel(n){var d=addMonths(new Date(today().getFullYear(),today().getMonth(),1),n);return MONTHS[d.getMonth()]+" "+d.getFullYear();}
function vDebt(){
  var plan=S.debtPlan, sim=simulate(plan.strategy,plan.extra), alt=simulate(plan.strategy==="snowball"?"avalanche":"snowball",plan.extra), base=simulate(plan.strategy,0);
  var total=S.debts.reduce(function(a,d){return a+(+d.balance||0);},0), mins=S.debts.reduce(function(a,d){return a+(+d.min||0);},0);
  var rows=S.debts.map(function(d){var o=null;sim.order.forEach(function(x,i){if(x.id===d.id)o={i:i+1,m:x.paidOff};});
    return '<tr><td><b>'+esc(d.name)+'</b>'+(o&&o.m?'<div class="small muted">#'+o.i+' · paid off '+addMonthsLabel(o.m)+'</div>':'')+'</td><td class="num">'+money(d.balance)+'</td><td class="num hide-m">'+(+d.apr||0)+'%</td><td class="num hide-m">'+money(d.min)+'</td><td class="num actc"><button class="btn sm pri" data-act="payDebt" data-id="'+d.id+'">Log payment</button> <button class="btn sm ghost" data-act="editDebt" data-id="'+d.id+'">Edit</button></td></tr>';}).join("");

  else if(!sim.ok)res='<div class="banner">With these payments the debt never gets paid off — the interest is bigger than what you pay. Raise the extra payment or the minimums.</div>';
  else{
    var saved=base.ok?round2(base.interest-sim.interest):0, monthsSaved=base.ok?base.months-sim.months:0;
    res='<div class="grid g3"><div><div class="tag">Debt-free</div><div style="font-size:26px;font-weight:800" data-test="debtfree">'+addMonthsLabel(sim.months)+'</div><div class="small muted">'+sim.months+' months</div></div><div><div class="tag">Interest you will pay</div><div style="font-size:26px;font-weight:800">'+money(sim.interest,{whole:1})+'</div><div class="small muted">at '+money(sim.budget,{whole:1})+' a month</div></div><div><div class="tag">Your extra payment saves</div><div style="font-size:26px;font-weight:800" class="pos">'+money(Math.max(0,saved),{whole:1})+'</div><div class="small muted">'+(!base.ok?"minimums alone would never clear it":(monthsSaved>0?monthsSaved+" months sooner":"add an extra amount to see"))+'</div></div></div>'+

  }

/* ---------- modals ---------- */
function modal(html,onSubmit,opts){
  closeModal();
  var o=document.createElement("div");o.className="overlay";o.id="ov";
  o.innerHTML='<form class="modal" novalidate>'+html+'</form>';
  document.body.appendChild(o);
  var f=o.querySelector("form");
  f.addEventListener("submit",function(e){e.preventDefault();if(onSubmit&&onSubmit(f)!==false)closeModal();});
  o.addEventListener("click",function(e){if(e.target===o||e.target.getAttribute("data-close")!==null)closeModal();});
  var first=f.querySelector("input:not([type=hidden]):not([type=radio]),select,textarea");if(first&&!(opts&&opts.nofocus))setTimeout(function(){first.focus();if(first.select)try{first.select();}catch(e){}},30);
  return f;
}
function closeModal(){var o=$("#ov");if(o)o.remove();}
function confirmBox(title,text,okLabel,fn,danger){modal('<h3>'+title+'</h3><p class="muted">'+text+'</p><div class="acts"><button type="button" class="btn" data-close>Cancel</button><button class="btn '+(danger?"danger":"pri")+'" type="submit">'+okLabel+'</button></div>',function(){fn();},{nofocus:1});}
function toast(t){var x=$("#toast");if(x)x.remove();x=document.createElement("div");x.className="toast";x.id="toast";x.textContent=t;document.body.appendChild(x);setTimeout(function(){if(x.parentNode)x.remove();},2200);}
function catOptions(sel,groups){return S.categories.filter(function(c){return !groups||groups.indexOf(c.group)>=0;}).map(function(c){return '<option value="'+c.id+'"'+(sel===c.id?" selected":"")+'>'+esc(c.name)+'</option>';}).join("");}
function val(f,n){var el=f.querySelector('[name="'+n+'"]');return el?el.value:"";}
function err(f,msg){var e=f.querySelector(".ferr");if(!e){e=document.createElement("div");e.className="ferr neg small";e.style.marginTop="10px";f.querySelector(".acts").before(e);}e.textContent=msg;return false;}
function txModal(t,type){
  var isNew=!t; t=t||{date:todayIso(),type:type||"expense",amount:"",cat:ui.quickCat||(catByName("Groceries")||S.categories[0]||{}).id,note:""};
  var chips=t.type==="expense"?'<div class="chips full" id="qchips">'+S.categories.filter(function(c){return c.group==="Needs"||c.group==="Wants";}).slice(0,10).map(function(c){return '<button type="button" class="chip'+(t.cat===c.id?" on":"")+'" data-qc="'+c.id+'">'+esc(c.name)+'</button>';}).join("")+'</div>':"";
  var f=modal('<h3>'+(isNew?(t.type==="income"?"Add income":"Add spending"):"Edit transaction")+'</h3><p class="small muted" style="margin:0 0 14px">'+(t.type==="income"?"Paychecks, side income, refunds.":"Type the amount, pick a category, done.")+'</p>'+
    '<div class="form c2"><label class="f">Amount<input name="amount" type="text" inputmode="decimal" autocomplete="off" value="'+(t.amount||"")+'" required></label><label class="f">Date<input name="date" type="date" value="'+t.date+'"></label>'+
    chips+(t.type==="expense"?'<label class="f full">Category<select name="cat">'+catOptions(t.cat)+'</select></label>':'')+
    '<label class="f full">Note<input name="note" type="text" value="'+esc(t.note)+'" placeholder="'+(t.type==="income"?"Paycheck":"Optional — e.g. Costco")+'"></label></div>'+
    '<div class="acts">'+(isNew?'':'<button type="button" class="btn danger" data-del="1" style="margin-right:auto">Delete</button>')+'<button type="button" class="btn" data-close>Cancel</button><button class="btn pri" type="submit">'+(isNew?"Add":"Save")+'</button></div>',
    function(f){var a=round2(num(val(f,"amount")));if(a<=0)return err(f,"Enter an amount above zero.");
      var o={date:val(f,"date")||todayIso(),amount:a,note:val(f,"note").trim(),type:t.type,cat:t.type==="expense"?val(f,"cat"):null};
      if(isNew){o.id=uid();o.created=Date.now();S.tx.push(o);ui.quickCat=o.cat;}else Object.assign(t,o);
      commit(isNew?(o.type==="income"?"Income added":"Spending added"):"Saved");});
  f.addEventListener("click",function(e){var q=e.target.getAttribute&&e.target.getAttribute("data-qc");if(q){f.querySelector('[name="cat"]').value=q;[].forEach.call(f.querySelectorAll(".chip"),function(c){c.classList.toggle("on",c===e.target);});}
    if(e.target.getAttribute&&e.target.getAttribute("data-del")){S.tx=S.tx.filter(function(x){return x.id!==t.id;});closeModal();commit("Deleted");}});
}
function billModal(b){
  var isNew=!b; b=b||{name:"",amount:"",freq:"monthly",next:todayIso(),cat:(catByName("Utilities")||S.categories[0]).id};
  modal('<h3>'+(isNew?"Add bill":"Edit bill")+'</h3><div class="form c2" style="margin-top:12px"><label class="f full">Name<input name="name" type="text" value="'+esc(b.name)+'" placeholder="Rent, electric, Netflix…"></label>'+
   '<label class="f">Amount<input name="amount" type="text" inputmode="decimal" autocomplete="off" value="'+(b.amount||"")+'"></label><label class="f">Repeats<select name="freq">'+Object.keys(FREQ).map(function(k){return '<option value="'+k+'"'+(b.freq===k?" selected":"")+'>'+FREQ[k]+'</option>';}).join("")+'</select></label>'+
   '<label class="f">Next due date<input name="next" type="date" value="'+b.next+'"></label><label class="f">Category<select name="cat">'+catOptions(b.cat)+'</select></label></div>'+
   '<div class="acts">'+(isNew?'':'<button type="button" class="btn danger" data-del="1" style="margin-right:auto">Delete</button>')+'<button type="button" class="btn" data-close>Cancel</button><button class="btn pri" type="submit">'+(isNew?"Add bill":"Save")+'</button></div>',
   function(f){var n=val(f,"name").trim(),a=round2(num(val(f,"amount"))),d=val(f,"next");if(!n)return err(f,"Give the bill a name.");if(a<=0)return err(f,"Enter the amount.");if(!d)return err(f,"Pick the next due date.");
     var o={name:n,amount:a,freq:val(f,"freq"),next:d,day:parse(d).getDate(),cat:val(f,"cat")};
     if(isNew){o.id=uid();S.bills.push(o);}else Object.assign(b,o);commit(isNew?"Bill added":"Saved");});
  var f=$("#ov form");f.addEventListener("click",function(e){if(e.target.getAttribute&&e.target.getAttribute("data-del")){S.bills=S.bills.filter(function(x){return x.id!==b.id;});closeModal();commit("Bill removed");}});
}
function payBill(b){
  modal('<h3>Mark '+esc(b.name)+' paid</h3><p class="muted small">This logs the payment as spending and moves the due date to the next one.</p><div class="form c2"><label class="f">Amount paid<input name="amount" type="text" inputmode="decimal" autocomplete="off" value="'+b.amount+'"></label><label class="f">Paid on<input name="date" type="date" value="'+todayIso()+'"></label></div><div class="acts"><button type="button" class="btn" data-close>Cancel</button><button class="btn pri" type="submit">Mark paid</button></div>',
   function(f){var a=round2(num(val(f,"amount")));if(a<=0)return err(f,"Enter the amount paid.");S.tx.push({id:uid(),date:val(f,"date")||todayIso(),type:"expense",amount:a,cat:b.cat,note:b.name,created:Date.now(),src:"bill"});
     var n=advanceBill(b);if(n){b.next=n;}else{S.bills=S.bills.filter(function(x){return x.id!==b.id;});}commit(b.name+" paid"+(n?" · next due "+shortDate(n):""));});
}
function goalModal(g){
  var isNew=!g; g=g||{name:"",target:"",saved:0,date:""};
  modal('<h3>'+(isNew?"New savings goal":"Edit goal")+'</h3><div class="form c2" style="margin-top:12px"><label class="f full">Goal<input name="name" type="text" value="'+esc(g.name)+'" placeholder="Emergency fund"></label><label class="f">Target amount<input name="target" type="text" inputmode="decimal" autocomplete="off" value="'+(g.target||"")+'"></label><label class="f">Already saved<input name="saved" type="text" inputmode="decimal" autocomplete="off" value="'+(g.saved||"")+'"></label><label class="f full">Target date (optional)<input name="date" type="date" value="'+esc(g.date)+'"></label></div>'+
   '<div class="acts">'+(isNew?'':'<button type="button" class="btn danger" data-del="1" style="margin-right:auto">Delete</button>')+'<button type="button" class="btn" data-close>Cancel</button><button class="btn pri" type="submit">'+(isNew?"Create goal":"Save")+'</button></div>',
   function(f){var n=val(f,"name").trim(),t=round2(num(val(f,"target")));if(!n)return err(f,"Name your goal.");if(t<=0)return err(f,"Set a target amount.");var o={name:n,target:t,saved:round2(num(val(f,"saved"))),date:val(f,"date")};if(isNew){o.id=uid();S.goals.push(o);}else Object.assign(g,o);commit(isNew?"Goal created":"Saved");});
  var f=$("#ov form");f.addEventListener("click",function(e){if(e.target.getAttribute&&e.target.getAttribute("data-del")){S.goals=S.goals.filter(function(x){return x.id!==g.id;});closeModal();commit("Goal removed");}});
}
function addToGoal(g){
  modal('<h3>Add money to '+esc(g.name)+'</h3><div class="form c2" style="margin-top:12px"><label class="f">Amount<input name="amount" type="text" inputmode="decimal" autocomplete="off"></label><label class="f">Date<input name="date" type="date" value="'+todayIso()+'"></label><label class="f full row" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="log" checked style="width:auto"> Take it from my spending balance (logs it in Savings)</label></div><div class="acts"><button type="button" class="btn" data-close>Cancel</button><button class="btn pri" type="submit">Add</button></div>',
   function(f){var a=round2(num(val(f,"amount")));if(a<=0)return err(f,"Enter an amount.");g.saved=round2((+g.saved||0)+a);if(f.querySelector('[name="log"]').checked){S.tx.push({id:uid(),date:val(f,"date")||todayIso(),type:"expense",amount:a,cat:ensureCat("Savings","Savings").id,note:g.name,created:Date.now(),src:"goal"});}commit("Added to "+g.name);});
}
function debtModal(d){
  var isNew=!d; d=d||{name:"",balance:"",apr:"",min:""};
  modal('<h3>'+(isNew?"Add debt":"Edit debt")+'</h3><div class="form c2" style="margin-top:12px"><label class="f full">Name<input name="name" type="text" value="'+esc(d.name)+'" placeholder="Credit card, car loan…"></label><label class="f">Current balance<input name="balance" type="text" inputmode="decimal" autocomplete="off" value="'+(d.balance||"")+'"></label><label class="f">Interest rate (APR %)<input name="apr" type="text" inputmode="decimal" autocomplete="off" value="'+(d.apr||"")+'"></label><label class="f">Minimum payment / month<input name="min" type="text" inputmode="decimal" autocomplete="off" value="'+(d.min||"")+'"></label></div>'+
   '<div class="acts">'+(isNew?'':'<button type="button" class="btn danger" data-del="1" style="margin-right:auto">Delete</button>')+'<button type="button" class="btn" data-close>Cancel</button><button class="btn pri" type="submit">'+(isNew?"Add debt":"Save")+'</button></div>',
   function(f){var n=val(f,"name").trim(),b=round2(num(val(f,"balance")));if(!n)return err(f,"Name the debt.");if(b<0)return err(f,"Balance can't be negative.");var o={name:n,balance:b,apr:num(val(f,"apr")),min:round2(num(val(f,"min")))};if(o.min<=0&&b>0)return err(f,"Enter the minimum monthly payment.");if(isNew){o.id=uid();S.debts.push(o);}else Object.assign(d,o);commit(isNew?"Debt added":"Saved");});
  var f=$("#ov form");f.addEventListener("click",function(e){if(e.target.getAttribute&&e.target.getAttribute("data-del")){S.debts=S.debts.filter(function(x){return x.id!==d.id;});closeModal();commit("Debt removed");}});
}
function payDebt(d){
  modal('<h3>Log a payment on '+esc(d.name)+'</h3><p class="small muted">The balance goes down by the payment. Update it from your statement any time with Edit.</p><div class="form c2"><label class="f">Amount<input name="amount" type="text" inputmode="decimal" autocomplete="off" value="'+(d.min||"")+'"></label><label class="f">Date<input name="date" type="date" value="'+todayIso()+'"></label></div><div class="acts"><button type="button" class="btn" data-close>Cancel</button><button class="btn pri" type="submit">Log payment</button></div>',
   function(f){var a=round2(num(val(f,"amount")));if(a<=0)return err(f,"Enter the amount.");d.balance=Math.max(0,round2(d.balance-a));S.tx.push({id:uid(),date:val(f,"date")||todayIso(),type:"expense",amount:a,cat:ensureCat("Debt payments","Debt").id,note:d.name,created:Date.now(),src:"debt"});commit(d.balance===0?d.name+" is paid off!":"Payment logged");});
}
function balanceModal(){
  modal('<h3>Update your balance</h3><p class="small muted">Enter what is in your everyday account right now (check your banking app). Spending you log from now on is taken off automatically.</p><div class="form"><label class="f">Balance now<input name="amount" type="text" inputmode="decimal" autocomplete="off" value="'+currentBalance()+'"></label></div><div class="acts"><button type="button" class="btn" data-close>Cancel</button><button class="btn pri" type="submit">Save balance</button></div>',
   function(f){S.balance={amount:round2(num(val(f,"amount"))),asOf:todayIso(),setAt:Date.now()};commit("Balance updated");});
}

  var s=safeToSpend();
  var dl=s.due.map(function(d){return '<div class="split small"><span>'+esc(d.name)+' · '+shortDate(d.date)+'</span><b>−'+money(d.amount)+'</b></div>';}).join("");
  modal('<h3>How safe to spend is worked out</h3><div style="margin-top:12px"><div class="split"><span>Balance now</span><b>'+money(s.balance)+'</b></div><div class="split"><span>Bills due before payday ('+s.due.length+')</span><b>−'+money(s.bills)+'</b></div>'+(dl?'<div style="padding-left:12px">'+dl+'</div>':'')+'<div class="split"><span>Safety buffer</span><b>−'+money(s.buffer)+'</b></div><div class="split" style="font-size:16px"><span><b>Safe to spend</b></span><b>'+money(s.safe)+'</b></div><div class="split"><span>Days until payday</span><b>'+s.days+'</b></div><div class="split"><span>Per day</span><b>'+money(s.perDay)+'</b></div></div><p class="small muted">Your balance changes when you log spending or income, pay a bill, add to a goal or log a debt payment. Use “Update balance” on the Today page to match your bank.</p><div class="acts"><button class="btn pri" type="submit">Got it</button></div>',null,{nofocus:1});
}
function catModal(){
  modal('<h3>Add category</h3><div class="form c2" style="margin-top:12px"><label class="f">Name<input name="name" type="text"></label><label class="f">Group<select name="group"><option>Needs</option><option>Wants</option><option>Savings</option><option>Debt</option></select></label><label class="f">Planned per month<input name="planned" type="text" inputmode="decimal" autocomplete="off"></label></div><div class="acts"><button type="button" class="btn" data-close>Cancel</button><button class="btn pri" type="submit">Add</button></div>',
   function(f){var n=val(f,"name").trim();if(!n)return err(f,"Name the category.");if(catByName(n))return err(f,"That category already exists.");S.categories.push({id:uid(),name:n,group:val(f,"group"),planned:round2(num(val(f,"planned")))});commit("Category added");});
}

  o.innerHTML='<div class="modal" style="max-width:620px"><div class="tag">ControlRoomStudio</div><h3 style="font-size:26px;margin-top:6px">Budget Control Room</h3><p class="muted">A private budget planner that runs in your browser. No account, no subscription, no internet needed. Everything stays on this device.</p>'+

  document.body.appendChild(o);

function setupModal(){
  var st=(S&&S.settings)||blank().settings;
  var cur=CURRENCIES.map(function(c){return '<option'+(st.currency===c?" selected":"")+'>'+c+'</option>';}).join("");
  var guess=(function(){try{var r=new Intl.NumberFormat().resolvedOptions().locale||"";if(/GB/.test(r))return "GBP";if(/CA/.test(r))return "CAD";if(/AU/.test(r))return "AUD";if(/HU/.test(r))return "HUF";if(/-(DE|FR|IT|ES|NL|AT|IE|FI|PT|BE|GR|SK|SI|EE|LV|LT|LU|MT|CY)/.test(r))return "EUR";}catch(e){}return "USD";})();
  if(!S||S.meta.example)cur=CURRENCIES.map(function(c){return '<option'+(guess===c?" selected":"")+'>'+c+'</option>';}).join("");
  var o=$("#ov");if(o)o.remove();
  modal('<h3>Set up your budget</h3><p class="small muted">You can change all of this later in Settings.</p><div class="form c2" style="margin-top:8px">'+
   '<label class="f">Your name (optional)<input name="name" type="text"></label><label class="f">Currency<select name="currency">'+cur+'</select></label>'+
   '<label class="f">1 · Money in your everyday account now<input name="balance" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 1250"></label>'+
   '<label class="f">2 · Take-home pay per month<input name="income" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 3800"></label>'+
   '<label class="f">3 · How often you are paid<select name="freq"><option value="monthly">Monthly</option><option value="biweekly">Every 2 weeks</option><option value="weekly">Every week</option><option value="twice">Twice a month (1st &amp; 15th)</option></select></label>'+
   '<label class="f">4 · Next payday<input name="payday" type="date" value="'+iso(addDays(today(),7))+'"></label></div>'+
   '<p class="small muted">Next you will add your bills, so the app can hold that money back from what is safe to spend.</p>'+
   '<div class="acts"><button class="btn pri" type="submit">Create my budget</button></div>',
   function(f){var s=blank();s.settings.name=val(f,"name").trim();s.settings.currency=val(f,"currency");s.settings.monthlyIncome=round2(num(val(f,"income")));s.settings.payFreq=val(f,"freq");s.settings.nextPayday=val(f,"payday");
     s.settings.payAnchor=s.settings.nextPayday?parse(s.settings.nextPayday).getDate():1;s.balance={amount:round2(num(val(f,"balance"))),asOf:todayIso(),setAt:Date.now()};s.meta.setupDone=true;S=s;view="bills";save();render();setTimeout(function(){toast("Budget created — add your first bill");},50);});
}
/* ---------- backup ---------- */
function download(name,text,type){
  try{var touch=window.matchMedia&&window.matchMedia("(pointer:coarse)").matches;
    if(touch&&window.File&&navigator.canShare){var file=new File([text],name,{type:type});if(navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(function(){});return;}}}catch(e){}
  var b=new Blob([text],{type:type});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}
function backup(){S.meta.lastBackup=Date.now();save();download("budget-control-room-backup-"+todayIso()+".json",JSON.stringify({app:"BudgetControlRoom",version:1,exported:new Date().toISOString(),data:S},null,1),"application/json");render();toast("Backup downloaded");}
function csv(){
  var rows=[["Date","Type","Category","Note","Amount"]];
  S.tx.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(t){rows.push([t.date,t.type,t.type==="income"?"Income":catName(t.cat),t.note||"",(t.type==="income"?"":"-")+(+t.amount).toFixed(2)]);});
  download("budget-transactions-"+todayIso()+".csv",rows.map(function(r){return r.map(function(c){c=String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(",");}).join("\r\n"),"text/csv");toast("CSV exported");
}
function restoreFile(file){
  var r=new FileReader();
  r.onload=function(){try{var o=JSON.parse(r.result);var d=o&&o.data?o.data:o;if(!d||!Array.isArray(d.tx)||!d.settings)throw new Error("x");
      var apply=function(){S=migrate(d);S.meta.example=false;save();closeModal();view="today";render();toast("Backup restored");};
      if(S&&!S.meta.example&&S.tx.length)confirmBox("Replace your current budget?","Restoring replaces everything in this browser with the backup from "+(o.exported?new Date(o.exported).toLocaleDateString():"the file")+".","Replace",apply,true);else apply();
    }catch(e){toast("That file is not a Budget Control Room backup");}};
  r.readAsText(file);
}
/* ---------- theme ---------- */
function applyTheme(){var t=S?S.settings.theme:"auto";var dark=t==="dark"||(t==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",dark?"dark":"light");}
/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-nav],[data-act],[data-strat]");if(!el)return;
  if(el.closest(".modal form")&&!el.getAttribute("data-act")&&!el.getAttribute("data-nav"))return;
  var nv=el.getAttribute("data-nav");if(nv){view=nv;closeModal();render();window.scrollTo(0,0);return;}
  var st=el.getAttribute("data-strat");if(st){S.debtPlan.strategy=st;commit();return;}
  var a=el.getAttribute("data-act"), id=el.getAttribute("data-id");
  function find(arr){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null;}
  switch(a){
    case "welcomeExample":S=example();save();$("#ov").remove();view="today";render();break;
    case "welcomeFresh":demoLock("Your own budget");break;
    case "startFresh":demoLock("Your own budget");break;
    case "quick":txModal(null,"expense");break;
    case "addIncome":txModal(null,"income");break;
    case "editTx":txModal(find(S.tx));break;
    case "how":howModal();break;
    case "setBalance":balanceModal();break;
    case "mprev":ui.month=ym(addMonths(parse(ui.month+"-01"),-1));render();break;
    case "mnext":ui.month=ym(addMonths(parse(ui.month+"-01"),1));render();break;
    case "addBill":billModal();break;
    case "editBill":billModal(find(S.bills));break;
    case "payBill":payBill(find(S.bills));break;
    case "addGoal":goalModal();break;
    case "editGoal":goalModal(find(S.goals));break;
    case "addToGoal":addToGoal(find(S.goals));break;
    case "addDebt":debtModal();break;
    case "editDebt":debtModal(find(S.debts));break;
    case "payDebt":payDebt(find(S.debts));break;
    case "addCat":catModal();break;
    case "delCat":(function(){var c=cat(id);var used=S.tx.some(function(t){return t.cat===id;})||S.bills.some(function(b){return b.cat===id;});
      confirmBox("Remove "+esc(c.name)+"?",used?"Transactions and bills in this category will move to “Other”.":"This category is not used yet.","Remove",function(){var other=ensureCat("Other","Wants");if(other.id===id){toast("Keep at least the Other category");return;}S.tx.forEach(function(t){if(t.cat===id)t.cat=other.id;});S.bills.forEach(function(b){if(b.cat===id)b.cat=other.id;});S.categories=S.categories.filter(function(x){return x.id!==id;});commit("Category removed");},true);})();break;
    case "backup":demoLock("Backup");break;
    case "dismissBackup":S.meta.dismissedBackupAt=Date.now();commit();break;
    case "csv":demoLock("CSV export");break;
    case "more":moreSheet();break;
    default:if(window.BCR_ACT)window.BCR_ACT(a,el);
    case "restore":demoLock("Restore");break;
    case "restoreX":var inp=$("#restoreFile");if(!inp){inp=document.createElement("input");inp.type="file";inp.id="restoreFile";inp.accept=".json,application/json,text/plain";inp.hidden=true;document.body.appendChild(inp);}inp.value="";inp.click();break;
    case "loadExample":S=example();view="today";commit("Demo reset");break;
    case "loadExampleX":confirmBox("Load example numbers?","This replaces everything in this browser with example data. Download a backup first if you want to keep your budget.","Load example",function(){S=example();view="today";commit("Example loaded");},true);break;
    case "wipe":demoLock("Starting your own budget");break;
    case "wipeX":confirmBox("Erase everything?","This deletes your budget from this browser. It cannot be undone unless you have a backup file.","Erase",function(){try{localStorage.removeItem(KEY);}catch(e){}S=null;view="today";render();},true);break;
  }
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="restoreFile"&&t.files&&t.files[0]){restoreFile(t.files[0]);return;}
  if(!S)return;
  var p=t.getAttribute("data-plan");if(p){var c=cat(p);if(c){c.planned=round2(num(t.value));commit();}return;}
  if(t.getAttribute("data-income")){S.settings.monthlyIncome=round2(num(t.value));commit();return;}
  if(t.getAttribute("data-extra")){S.debtPlan.extra=Math.max(0,round2(num(t.value)));commit();return;}
  var k=t.getAttribute("data-set");if(k){var v=t.value;if(["buffer","monthlyIncome"].indexOf(k)>=0)v=round2(num(v));if(["payDayA","payDayB"].indexOf(k)>=0)v=Math.min(31,Math.max(1,parseInt(v,10)||1));if(k==="nextPayday"&&v)S.settings.payAnchor=parse(v).getDate();S.settings[k]=v;commit("Saved");return;}
  var cn=t.getAttribute("data-catname");if(cn){var c2=cat(cn),nv=t.value.trim();if(c2&&nv){c2.name=nv;commit("Saved");}return;}
  var cg=t.getAttribute("data-catgroup");if(cg){var c3=cat(cg);if(c3){c3.group=t.value;commit("Saved");}return;}
  var fl=t.getAttribute("data-filter");if(fl==="cat"){ui.txFilter.cat=t.value;render();}
});
document.addEventListener("input",function(e){var t=e.target;if(t.getAttribute("data-filter")==="q"){ui.txFilter.q=t.value;var pos=t.selectionStart;render();var n=$('[data-filter="q"]');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(x){}}}});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal();});

if(window.matchMedia)try{window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){render();});}catch(e){}
/* ---------- boot ---------- */
load();
render();
window.__BCR={demo:true,get state(){return S;},render:function(){render();},safeToSpend:function(){return safeToSpend();},simulate:simulate,currentBalance:function(){return currentBalance();}};
})();
